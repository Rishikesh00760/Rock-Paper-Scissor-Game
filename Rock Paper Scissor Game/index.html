<html>
<head>

	<title>Rock Paper Scissor Game</title>
	
	<link rel="stylesheet" href="./style.css">
	<link rel="icon" href="./img/icon/icon.png">

</head>
<body>
	
	<div class="mobilePopUp">
		You cannot see this website in devices of width 1280 pixels or less
	</div>

	<div class="promptScreen" id="promptScreen">

		<div class="promptCard">

			<h1>Rock Paper Scissor Game</h1>
			<hr>
			<br><br><br><br><br>
			<h4>Enter the Maximum number of points to win: </h4><br>
			<input type="number" id="maxPoint" class="maxPoint" placeholder="Max points" max="10000000000" min="1">
			<br>
			<span id="maxPointError">Max points cannot be less than 1</span>
			<br>
			<button class="reset" id="reset">Reset</button>
			<button class="play" id="play">Play</button>

		</div>

	</div>
	
	<div class="winnerScreen" id="winnerScreen">

		<div class="winnerScreenCard">

			<h1 id="winorloose"></h1>
			<hr>
			<div class="cptr-res-winscreen">
				<span>Computer - <span id="cpoint"></span></span>
				<br><br>
				<img class="img" id="cptr-out-img-winscreen" width="320px" height="200px">
			</div>
			<div class="plyr-res-winscreen">
				<span>Player - <span id="ppoint"></span></span>
				<br><br>
				<img class="img" id="plyr-out-img-winscreen" width="320px" height="200px">
			</div>
			<br><br><br>
			<hr>
			<h1 id="winner"></h1>
			<button class="playAgain" id="playAgain">Play Again</button>

		</div>

	</div>

	<div class="container" id="container">
	
		<h1 class="title">Rock Paper Scissor Game</h1>
		
		<table rules="all">
		
			<tr>
				<td class="computer-points" id="computer-points-output">0</td>
				<td class="player-points" id="player-points-output">0</td>
			</tr>
			
			<tr>
				<td>Computer</td>
				<td>&nbsp;Player&nbsp;</td>
			</tr>
		
		</table>
		
		<div class="controls">
		
			<button class="ctrl-btn" id="rock">Rock</button>
			<button class="ctrl-btn"id="paper">Paper</button>
			<button class="ctrl-btn" id="scissor">Scissor</button>
			<br>
			<button class="ctrl-rld-btn" onclick="location.reload()">Reload</button>
		
		</div>
		
		<div class="cptr-res">
		
			<span>Computer</span>
			<br><br>
			<img class="img" id="cptr-out-img" width="300px" height="200px">
		
		</div>
		
		<div class="plyr-res">
		
			<span>Player</span>
			<br><br>
			<img class="img" id="plyr-out-img" width="300px" height="200px">
		
		</div>
	
	</div>
	
	<script src="./index.js"></script>

</body>
</html>
